services:
  - type: web
    name: ten-term-customer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://ryucqteaazvlsshqcybc.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PAYSTACK_ENABLED
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PREFERRED_BANK
        value: titan-paystack
      - key: PUBLIC_APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
